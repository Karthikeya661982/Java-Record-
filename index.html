 if(w.table){h+=`<table class="cmp"><tr>${w.table.h.map(x=>`<th>${x}</th>`).join("")}</tr>${w.table.r.map(r=>`<tr>${r.map((x,i)=>i?`<td>${x}</td>`:`<th>${x}</th>`).join("")}</tr>`).join("")}</table>`}
 if(w.steps)w.steps.forEach(s=>h+=`<h2>${s[0]}</h2><ol>${s[1].map(x=>`<li>${esc(x)}</li>`).join("")}</ol>`);
 if(w.progs)h+=`<div class="plist">${w.progs.map((p,i)=>`<a href="#/w/${k}/${i+1}"><i>${num(i+1)}</i><span>${p.t}${p.c?"":' <small class="pend">(code pending)</small>'}</span></a>`).join("")}</div>`;
 app.innerHTML=h;
}
function prog(k,n){
 const w=W[k],p=w&&w.progs&&w.progs[n-1];if(!p)return home();
 let h=`<p class="crumb"><a href="#/">Home</a> / <a href="#/w/${k}">Week ${k}</a> / Program ${n}</p><h1>Program ${num(n)}</h1><p><b>Aim:</b> ${p.t}</p>`;
 h+=p.c?`<div class="lbl">SOURCE CODE</div><pre>${esc(p.c)}</pre><div class="lbl">OUTPUT</div><pre class="out">${esc(p.o)}</pre>`:`<p class="pend">Code and output for this program will be added soon.</p>`;
 h+=`<div class="nav">${n>1?`<a href="#/w/${k}/${n-1}">← Previous</a>`:`<span></span>`}${n<w.progs.length?`<a href="#/w/${k}/${+n+1}">Next →</a>`:`<a href="#/w/${k}">All programs</a>`}</div>`;
 app.innerHTML=h;
}
function route(){const p=location.hash.split("/");window.scrollTo(0,0);
 if(p[1]==="w"&&p[3])prog(p[2],+p[3]);else if(p[1]==="w")week(p[2]);else home();}
addEventListener("hashchange",route);route();
</script></body></html>
